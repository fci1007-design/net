<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>紫晶機械魔方</title>
<style>
:root{--line:#ffffff22;--panel:#180e26d9;--muted:#cdbbdd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#fff;background:radial-gradient(circle at 72% 8%,#41186d,#160a27 38%,#08050e 80%)}body{overflow:auto}.app{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px;align-items:start}.main{min-width:0;display:flex;flex-direction:column;gap:10px}.stage{height:clamp(430px,calc(100dvh - 190px),760px);min-height:430px;position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:radial-gradient(circle at 65% 22%,#a855f733,transparent 38%),#0c0713;box-shadow:0 24px 70px #0007}#view{width:100%;height:100%;display:block;touch-action:none}.brand{position:absolute;left:18px;top:14px;pointer-events:none}.brand h1{margin:0;font-size:20px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:calc(100% - 18px);padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:#0d0714b8;color:#e9dff4;font-size:10px;text-align:center;pointer-events:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;backdrop-filter:blur(14px)}.card h2{font-size:13px;margin:0 0 9px}.move-head{display:flex;justify-content:space-between;gap:8px}.move-head small{color:var(--muted);font-size:10px;font-weight:500}.moves{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}button{border:1px solid #e9d5ff2e;background:linear-gradient(#8247bc55,#49266e55);color:#fff;border-radius:11px;padding:10px 8px;font-weight:700;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(1px)}button.primary{background:linear-gradient(135deg,#9b4dee,#6d28d9)}.moves button{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;min-height:42px}.legend{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.5}.side{display:flex;flex-direction:column;gap:10px}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}.metric{background:#fff1;border:1px solid #fff1;border-radius:11px;padding:8px}.metric span{display:block;color:var(--muted);font-size:9px}.metric strong{font-size:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{display:flex;align-items:center;gap:8px;margin:9px 0}.row label{min-width:68px;color:var(--muted);font-size:11px}.row input{width:100%;accent-color:#8b5cf6}.switch{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-top:9px}.switch input{accent-color:#8b5cf6}.note{color:var(--muted);font-size:10px;line-height:1.6}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:8px;gap:10px}.stage{height:clamp(360px,58dvh,560px);min-height:360px}.moves{grid-template-columns:repeat(6,1fr)}.side{gap:8px}.brand{left:13px;top:11px}.brand h1{font-size:17px}}
@media(max-width:560px){.stage{height:54dvh;min-height:320px}.moves{grid-template-columns:repeat(4,1fr)}.moves button{min-height:44px}.move-head small{display:none}}
@media(max-width:390px){.moves{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="app"><main class="main"><section class="stage" id="stage"><canvas id="view"></canvas><div class="brand"><h1>紫晶機械魔方</h1><p>Purple Mechanical Cube · 3D simulator</p></div><div class="hint">拖曳旋轉視角｜滾輪縮放｜下方按鈕直接轉動魔方</div></section><section class="card"><h2 class="move-head"><span>六面旋轉</span><small>控制鈕固定在魔方正下方</small></h2><div class="moves" id="moves"></div><div class="legend">U 上、D 下、L 左、R 右、F 前、B 後；′ 代表逆時針。</div></section></main>
<aside class="side"><section class="card"><h2>操作</h2><div class="status"><div class="metric"><span>轉動步數</span><strong id="count">0</strong></div><div class="metric"><span>目前狀態</span><strong id="state">已復原</strong></div></div><div class="toolbar"><button class="primary" id="shuffle">隨機打亂</button><button id="reset">回復原狀</button><button id="undo">上一步</button><button id="camera">重設視角</button></div></section><section class="card"><h2>模擬參數</h2><div class="row"><label>轉動速度</label><input id="speed" type="range" min="120" max="650" step="10" value="260"></div><div class="row"><label>零件間隙</label><input id="gap" type="range" min="96" max="110" value="101"></div><label class="switch"><span>自動展示旋轉</span><input id="auto" type="checkbox"></label></section><section class="card note">手機、平板、電腦皆可使用。畫面會依螢幕尺寸自動重排；六面旋轉按鈕永遠位於魔方下方，不會被右側控制面板卡住。</section></aside></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
(()=>{const canvas=document.getElementById('view'),stage=document.getElementById('stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,100);scene.add(new THREE.HemisphereLight(0xd9c2ff,0x180d25,2.2));let key=new THREE.DirectionalLight(0xffffff,2.7);key.position.set(4,6,7);scene.add(key);let rim=new THREE.PointLight(0xa855f7,18,20);rim.position.set(-4,2,4);scene.add(rim);const viewGroup=new THREE.Group(),cubeRoot=new THREE.Group();viewGroup.add(cubeRoot);scene.add(viewGroup);viewGroup.rotation.set(-.42,-.68,0);camera.position.set(0,0,8.2);
let cubies=[],history=[],queue=[],turn=null,count=0,step=1.04,drag=false,last={x:0,y:0};const colors={px:0x7c3aed,nx:0x4c1d95,py:0xc084fc,ny:0x6d28d9,pz:0xa855f7,nz:0x312e81,dark:0x120a1c};function mat(c){return new THREE.MeshStandardMaterial({color:c,metalness:.34,roughness:.3})}function mats(x,y,z){return[mat(x===1?colors.px:colors.dark),mat(x===-1?colors.nx:colors.dark),mat(y===1?colors.py:colors.dark),mat(y===-1?colors.ny:colors.dark),mat(z===1?colors.pz:colors.dark),mat(z===-1?colors.nz:colors.dark)]}function build(){while(cubeRoot.children.length)cubeRoot.remove(cubeRoot.children[0]);cubies=[];history=[];queue=[];turn=null;count=0;for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){let m=new THREE.Mesh(new THREE.BoxGeometry(.91,.91,.91),mats(x,y,z));m.position.set(x*step,y*step,z*step);cubeRoot.add(m);cubies.push(m)}status()}function status(){document.getElementById('count').textContent=count;document.getElementById('state').textContent=count?'已操作':'已復原'}build();
function resize(){let r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);new ResizeObserver(resize).observe(stage);resize();
const defs={U:['y',1,-1],D:['y',-1,1],L:['x',-1,1],R:['x',1,-1],F:['z',1,-1],B:['z',-1,1]};function move(n,record=true){let p=n.includes('′')||n.includes("'"),k=n[0];if(!defs[k])return;let[a,l,d]=defs[k];queue.push({a,l,d:p?-d:d,n,record})}function start(m){let pivot=new THREE.Group();cubeRoot.add(pivot);let idx={x:'x',y:'y',z:'z'}[m.a],sel=cubies.filter(c=>Math.round(c.position[idx]/step)===m.l);sel.forEach(c=>pivot.attach(c));turn={...m,pivot,sel,start:performance.now(),from:0,to:m.d*Math.PI/2}}function finish(){let t=turn;t.sel.forEach(c=>{cubeRoot.attach(c);c.position.set(Math.round(c.position.x/step)*step,Math.round(c.position.y/step)*step,Math.round(c.position.z/step)*step);c.quaternion.normalize()});cubeRoot.remove(t.pivot);if(t.record!==false){history.push(t);count++}turn=null;status()}
let speed=document.getElementById('speed');function tick(now){requestAnimationFrame(tick);if(document.getElementById('auto').checked&&!drag&&!turn)viewGroup.rotation.y+=.0014;if(!turn&&queue.length)start(queue.shift());if(turn){let u=Math.min(1,(now-turn.start)/+speed.value),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;turn.pivot.rotation[turn.a]=turn.to*e;if(u>=1)finish()}renderer.render(scene,camera)}requestAnimationFrame(tick);
let pad=document.getElementById('moves');['U','U′','D','D′','L','L′','R','R′','F','F′','B','B′'].forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>move(n);pad.appendChild(b)});document.getElementById('shuffle').onclick=()=>{let ks=Object.keys(defs),p='';for(let i=0;i<20;i++){let k;do{k=ks[Math.floor(Math.random()*6)]}while(k===p);p=k;move(k+(Math.random()<.5?'′':''))}};document.getElementById('reset').onclick=build;document.getElementById('undo').onclick=()=>{if(turn||queue.length||!history.length)return;let m=history.pop();count=Math.max(0,count-1);status();queue.push({a:m.a,l:m.l,d:-m.d,n:'undo',record:false})};document.getElementById('camera').onclick=()=>{viewGroup.rotation.set(-.42,-.68,0);camera.position.z=8.2};document.getElementById('gap').oninput=e=>{let ns=+e.target.value/100,ratio=ns/step;step=ns;cubies.forEach(c=>c.position.multiplyScalar(ratio))};
canvas.onpointerdown=e=>{drag=true;last={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;viewGroup.rotation.y+=dx*.008;viewGroup.rotation.x=Math.max(-1.25,Math.min(1.25,viewGroup.rotation.x+dy*.008));last={x:e.clientX,y:e.clientY}};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();camera.position.z=Math.max(5.6,Math.min(12,camera.position.z+Math.sign(e.deltaY)*.4))};addEventListener('keydown',e=>{let k=e.key.toUpperCase();if(defs[k])move(k+(e.shiftKey?'′':''));else if(k==='S')document.getElementById('shuffle').click();else if(k==='Z')document.getElementById('undo').click();else if(e.key==='0')build()});})();
</script></body></html>
